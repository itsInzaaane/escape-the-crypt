<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape the Crypt — Final Lock</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#38253e,#100d17 70%);color:#f6e8d1;font-family:Georgia,serif;padding:20px}.panel{width:min(100%,460px);border:2px solid #9c7743;border-radius:18px;padding:35px 24px;text-align:center;background:linear-gradient(150deg,#28202d,#17131d);box-shadow:0 18px 70px #000a}h1{color:#eac17b;letter-spacing:2px;font-size:clamp(25px,6vw,37px);margin:15px 0}p{line-height:1.5;color:#dacdbf}.lock{font-size:48px}.digits{display:flex;gap:12px;justify-content:center;margin:28px 0}.digits input{width:75px;height:86px;border:2px solid #a88756;border-radius:10px;background:#110f17;color:white;text-align:center;font-size:40px;font-family:inherit}button{border:0;border-radius:10px;padding:15px 22px;cursor:pointer;font-weight:bold;letter-spacing:1px}#unlock{width:100%;background:#e4b66d;color:#241a17;font-size:18px}#reset{margin-top:15px;background:transparent;border:1px solid #817384;color:#e6d9cd}#status{margin-top:20px;min-height:64px;padding:15px;border-radius:10px;font-size:20px;font-weight:bold}#status:empty{display:none}.success{background:#174b37;color:#eaffed}.error{background:#5d252d;color:#fff0ef}.foot{font-size:12px;opacity:.7;margin-top:25px}</style></head><body><main class="panel"><div class="lock" id="lockIcon">🔒</div><h1>ESCAPE THE CRYPT</h1><p>Three challenges. Three numbers.<br>Enter the final combination to escape.</p><div class="digits"><input aria-label="First digit" inputmode="numeric" maxlength="1" pattern="[0-9]*"><input aria-label="Second digit" inputmode="numeric" maxlength="1" pattern="[0-9]*"><input aria-label="Third digit" inputmode="numeric" maxlength="1" pattern="[0-9]*"></div><button id="unlock">UNLOCK THE CRYPT</button><div id="status" role="status" aria-live="polite"></div><button id="reset">RESET</button><div class="foot">RRD MANOR · STATION 3</div></main><script>const inputs=[...document.querySelectorAll('.digits input')],status=document.getElementById('status'),icon=document.getElementById('lockIcon');inputs.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);status.textContent='';status.className='';icon.textContent='🔒';if(el.value&&i<2)inputs[i+1].focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)inputs[i-1].focus();if(e.key==='Enter')check()});el.addEventListener('paste',e=>{const s=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,3);if(s.length===3){e.preventDefault();inputs.forEach((x,j)=>x.value=s[j]);inputs[2].focus()}})});function check(){const code=inputs.map(x=>x.value).join('');if(code.length!==3){status.textContent='ENTER ALL THREE DIGITS';status.className='error';return}if(code==='472'){status.textContent='🔓 CRYPT UNLOCKED! YOU HAVE ESCAPED!';status.className='success';icon.textContent='🔓'}else{status.textContent='ACCESS DENIED — TRY AGAIN';status.className='error';icon.textContent='🔒'}}document.getElementById('unlock').onclick=check;document.getElementById('reset').onclick=()=>{inputs.forEach(x=>x.value='');status.textContent='';status.className='';icon.textContent='🔒';inputs[0].focus()};</script></body></html>
